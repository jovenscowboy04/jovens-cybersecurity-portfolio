<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1d33"/>
      <stop offset="70%" stop-color="#070e1b"/>
      <stop offset="100%" stop-color="#030710"/>
    </radialGradient>

    <!-- Neon Rim Light Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff3366" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Subtle Tech Circuit Lines -->
    <pattern id="techGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 229, 255, 0.08)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Circular Base -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="3"/>
  <circle cx="100" cy="100" r="95" fill="url(#techGrid)"/>

  <!-- Subtle Digital Target Reticle -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1" stroke-dasharray="4,6"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255, 51, 102, 0.15)" stroke-width="1" stroke-dasharray="2,8"/>

  <!-- Professional Cybersecurity Silhouette (Head & Shoulders) -->
  <g fill="#1a273e" stroke="rgba(0, 229, 255, 0.35)" stroke-width="1.5">
    <!-- Shoulders / Torso with Jacket Collar -->
    <path d="M 38 185 C 42 145 68 135 82 130 L 90 142 L 100 145 L 110 142 L 118 130 C 132 135 158 145 162 185 Z" fill="#0f1b2e" stroke="#00e5ff" stroke-width="1.8"/>
    
    <!-- Neck -->
    <path d="M 88 120 L 88 138 C 94 142 106 142 112 138 L 112 120 Z" fill="#14233c"/>

    <!-- Head & Hair Silhouette -->
    <path d="M 72 82 C 70 54 84 42 100 42 C 116 42 130 54 128 82 C 128 106 116 122 100 122 C 84 122 72 106 72 82 Z" fill="#182b48" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>

    <!-- High-Tech Visor / Cybersecurity Optic Line -->
    <path d="M 78 78 Q 100 84 122 78" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" filter="drop-shadow(0 0 5px #00e5ff)"/>
    <circle cx="85" cy="79" r="2" fill="#ff3366"/>
    <circle cx="115" cy="79" r="2" fill="#00e5ff"/>
  </g>

  <!-- Digital Nodes & Coordinate Accent Marks -->
  <circle cx="35" cy="100" r="2" fill="#00e5ff" opacity="0.6"/>
  <circle cx="165" cy="100" r="2" fill="#ff3366" opacity="0.6"/>
  <text x="100" y="178" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle" letter-spacing="2" opacity="0.8">SEC // IT</text>
</svg>
